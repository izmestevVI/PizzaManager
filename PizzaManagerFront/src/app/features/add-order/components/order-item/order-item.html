<td class="px-3 py-3 font-medium text-slate-900 dark:text-white">{{ index() + 1 }}</td>
<td class="px-3 py-3 text-slate-700 dark:text-slate-300">{{ pizzaOrderFormGroup().value.pizza?.name }}</td>
<td class="px-3 py-3">
  <div class="pizza-size-picker flex gap-1.5" role="group" aria-label="Pizza size">
    <ui-select-button [options]="sizes()" [formControl]="pizzaOrderFormGroup().controls.pizzaSize"></ui-select-button>
  </div>
</td>
<td class="px-3 py-3 font-bold whitespace-nowrap text-slate-900 dark:text-white">
  <ui-input [formControl]="pizzaOrderFormGroup().controls.count"></ui-input>
</td>
<td class="px-3 py-3 font-bold whitespace-nowrap text-slate-900 dark:text-white">{{ price() }} ₽</td>
<td class="px-3 py-3 text-center">
  <button
    (click)="deleteOrder.emit()"
    type="button"
    class="rounded-md bg-red-50 p-1.5 text-red-400 transition-colors hover:bg-red-100 hover:text-red-600 dark:bg-red-900/20 dark:hover:bg-red-900/40 dark:hover:text-red-300"
  >
    <i-lucide [name]="Trash2" class="h-4 w-4"></i-lucide>
  </button>
</td>
