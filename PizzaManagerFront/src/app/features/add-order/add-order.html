<div cdkScrollable class="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
  <div class="fixed inset-0 bg-slate-900/50 transition-opacity dark:bg-black/60" aria-hidden="true"></div>

  <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
    <div
      class="relative transform overflow-hidden rounded-2xl border border-gray-100 bg-white text-left shadow-xl transition-all transition-colors duration-200 sm:my-8 sm:w-full sm:max-w-2xl dark:border-slate-800 dark:bg-slate-950"
    >
      <div class="flex items-center justify-between border-b border-gray-100 px-6 py-4 dark:border-slate-800">
        <h2 class="text-lg font-bold tracking-wide text-slate-950 uppercase dark:text-white" id="modal-title">ОФОРМЛЕНИЕ НОВОГО ЗАКАЗА</h2>
        <button
          (click)="dialogRef.close()"
          type="button"
          class="rounded-md text-slate-400 hover:text-slate-500 focus:ring-2 focus:ring-orange-500 focus:outline-none"
        >
          <i-lucide [name]="X" class="h-5 w-5"></i-lucide>
        </button>
      </div>

      <form [formGroup]="form" class="space-y-6 p-6">
        <section class="space-y-4">
          <h3 class="text-xs font-semibold tracking-wider text-slate-500 uppercase dark:text-slate-400">Блок клиента</h3>

          <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
            <div class="relative">
              <ui-autocomplete
                label="Телефон"
                [formControl]="form.controls.customer"
                [options]="customersSelectOption() ?? []"
              ></ui-autocomplete>
            </div>

            <div>
              <ui-input label="Имя клиента" [formControl]="customersNameControl"></ui-input>
            </div>
          </div>
        </section>

        <section class="space-y-4">
          <h3 class="text-xs font-semibold tracking-wider text-slate-500 uppercase dark:text-slate-400">Блок состава заказа</h3>

          <div class="-mx-6 overflow-x-auto px-6">
            <table class="w-full min-w-[500px] text-left text-sm">
              <thead class="bg-gray-50/50 text-xs text-slate-500 uppercase dark:bg-slate-900/50 dark:text-slate-400">
                <tr>
                  <th class="px-3 py-2 font-medium">№</th>
                  <th class="px-3 py-2 font-medium">Товар</th>
                  <th class="px-3 py-2 font-medium">Размер</th>
                  <th class="px-3 py-2 font-medium">Кол.</th>
                  <th class="px-3 py-2 font-medium">Цена ₽</th>
                  <th class="px-3 py-2 text-center font-medium">Удалить</th>
                </tr>
              </thead>
              <tbody formArrayName="pizzas" class="divide-y divide-gray-100 dark:divide-slate-800">
                @for (group of form.controls.pizzas.controls; track $index) {
                  <tr
                    [app-order-item]="group"
                    [index]="$index"
                    (deleteOrder)="onPizzaDelete($index)"
                    class="transition-colors hover:bg-gray-50/50 dark:hover:bg-slate-900/50"
                  ></tr>
                }
              </tbody>
            </table>
          </div>

          <div class="relative pt-2">
            <ui-autocomplete
              label="Добавить товар"
              [formControl]="form.controls.addPizza"
              [options]="pizzasSelectOption() ?? []"
            ></ui-autocomplete>
          </div>

          <div class="flex justify-end border-t border-gray-100 pt-2 dark:border-slate-800">
            <div class="text-slate-600 dark:text-slate-400">Итого:</div>
            <div class="ml-3 text-xl font-extrabold text-slate-950 dark:text-white">{{ totalPrice() }} ₽</div>
          </div>
        </section>

        <section class="space-y-4 pt-2">
          <h3 class="text-xs font-semibold tracking-wider text-slate-500 uppercase dark:text-slate-400">Блок доставки и оплаты</h3>

          <div class="space-y-4">
            <div>
              <ui-input label="Адрес" placeholder="Улица, Дом, Кв" [formControl]="form.controls.address"></ui-input>
            </div>

            <div class="grid grid-cols-1 items-center gap-4 md:grid-cols-2">
              <ui-select-button
                label="Тип:"
                [formControl]="form.controls.deliveryType"
                [options]="deliveryTypeOptions"
                variant="inline"
              ></ui-select-button>
              <ui-select
                label="Оплата:"
                [formControl]="form.controls.paymentType"
                [options]="paymentOptions"
                placeholder="Выберите способ оплаты"
                variant="inline"
              ></ui-select>
            </div>
          </div>
        </section>
      </form>

      <div
        class="flex flex-col-reverse gap-3 rounded-b-2xl border-t border-gray-100 bg-gray-50 px-6 py-4 transition-colors sm:flex-row sm:justify-end dark:border-slate-800 dark:bg-slate-900/50"
      >
        <button ui-button variant="outline" size="sm" (click)="dialogRef.close()">Отмена</button>
        <button ui-button size="sm" [disabled]="isFormInvalid()" (click)="addOder()">
          <i-lucide [name]="Check" class="h-5 w-5"></i-lucide>
          Создать заказ
        </button>
      </div>
    </div>
  </div>
</div>
