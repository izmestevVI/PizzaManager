<div cdkScrollable class="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
  <div class="fixed inset-0 bg-slate-900/50 dark:bg-black/60 transition-opacity" aria-hidden="true"></div>

  <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
    
    <div class="relative transform overflow-hidden rounded-2xl bg-white dark:bg-slate-950 text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-2xl border border-gray-100 dark:border-slate-800 transition-colors duration-200">
      
      <div class="px-6 py-4 border-b border-gray-100 dark:border-slate-800 flex items-center justify-between">
        <h2 class="text-lg font-bold text-slate-950 dark:text-white uppercase tracking-wide" id="modal-title">
          ОФОРМЛЕНИЕ НОВОГО ЗАКАЗА
        </h2>
        <button (click)="dialogRef.close()" type="button" class="rounded-md text-slate-400 hover:text-slate-500 focus:outline-none focus:ring-2 focus:ring-orange-500">
          <i-lucide [name]="X" class="w-5 h-5"></i-lucide>
        </button>
      </div>

      <form [formGroup]="form" class="p-6 space-y-6">
        
        <section class="space-y-4">
          <h3 class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Блок клиента</h3>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="relative">
              <ui-autocomplete
                label="Телефон"
                [formControl]="form.controls.customer"
                [options]="customersSelectOption() ?? []"
              ></ui-autocomplete>
            </div>

            <div>
              <ui-input
                label="Имя клиента"
                [formControl]="customersNameControl"
              ></ui-input>
            </div>
          </div>
        </section>

        <section class="space-y-4">
          <h3 class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Блок состава заказа</h3>
          
          <div class="overflow-x-auto -mx-6 px-6">
            <table class="w-full text-sm text-left min-w-[500px]">
              <thead class="text-xs text-slate-500 bg-gray-50/50 dark:bg-slate-900/50 dark:text-slate-400 uppercase">
                <tr>
                  <th class="px-3 py-2 font-medium">№</th>
                  <th class="px-3 py-2 font-medium">Товар</th>
                  <th class="px-3 py-2 font-medium">Размер</th>
                  <th class="px-3 py-2 font-medium">Кол.</th>
                  <th class="px-3 py-2 font-medium">Цена ₽</th>
                  <th class="px-3 py-2 font-medium text-center">Удалить</th>
                </tr>
              </thead>
              <tbody formArrayName="pizzas" class="divide-y divide-gray-100 dark:divide-slate-800">
                @for (group of form.controls.pizzas.controls; track $index) {
                    <tr 
                    [app-order-item]="group" 
                    [index]="$index"
                    (deleteOrder)="onPizzaDelete($index)"
                    class="hover:bg-gray-50/50 dark:hover:bg-slate-900/50 transition-colors"
                    ></tr>
                }
                
              </tbody>
            </table>
          </div>

          <div class="relative pt-2">
            <ui-autocomplete
              label="Добавить товар"
              [formControl]="form.controls.addPizza"
              [options]="pizzasSelectOption() ?? []"
            ></ui-autocomplete>
          </div>

          <div class="flex justify-end pt-2 border-t border-gray-100 dark:border-slate-800">
            <div class="text-slate-600 dark:text-slate-400">Итого:</div>
            <div class="text-xl font-extrabold text-slate-950 dark:text-white ml-3">{{ totalPrice() }} ₽</div>
          </div>
        </section>

        <section class="space-y-4 pt-2">
          <h3 class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Блок доставки и оплаты</h3>
          
          <div class="space-y-4">
            <div>
                <ui-input
                    label="Адрес"
                    placeholder="Улица, Дом, Кв"
                    [formControl]="form.controls.address"
                ></ui-input>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-center">
              <ui-select-button
                label="Тип:"
                [formControl]="form.controls.deliveryType"
                [options]="deliveryTypeOptions"
                variant="inline"
              ></ui-select-button>
              <ui-select
                label="Оплата:"
                [formControl]="form.controls.paymentType"
                [options]="paymentOptions"
                placeholder="Выберите способ оплаты"
                variant="inline"
              ></ui-select>
            </div>
          </div>
        </section>
      </form>

      <div class="px-6 py-4 border-t border-gray-100 dark:border-slate-800 bg-gray-50 dark:bg-slate-900/50 flex flex-col-reverse sm:flex-row sm:justify-end gap-3 rounded-b-2xl transition-colors">
        <button 
          ui-button
          variant="outline" 
          size="sm"
          (click)="dialogRef.close()" 
        >
          Отмена
        </button>
        <button 
          ui-button
          size="sm"
          [disabled]="isFormInvalid()"
          (click)="addOder()" 
        >
          <i-lucide [name]="Check" class="w-5 h-5"></i-lucide>
          Создать заказ
        </button>
      </div>
    </div>
  </div>
</div>
