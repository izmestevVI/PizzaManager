<td class="px-4 py-3 md:px-6 md:py-4">
  <span class="font-bold text-slate-900 dark:text-white">№{{ order().id }}</span>
</td>
<td class="px-4 py-3 text-xs text-slate-600 md:px-6 md:py-4 md:text-sm dark:text-slate-400">
  {{ order().createdAt | date: 'HH:mm' }}
</td>
<td class="px-4 py-3 md:px-6 md:py-4">
  <div class="font-medium text-slate-900 dark:text-white">{{ order().customerName }}</div>
  <div class="text-[10px] text-slate-500 md:text-xs dark:text-slate-400">{{ order().customerPhone }}</div>
</td>
<td class="px-4 py-3 md:px-6 md:py-4">
  <div class="flex items-center gap-1.5 text-xs font-medium text-slate-900 md:text-sm dark:text-white">
    <i-lucide [name]="Navigation" class="h-3 w-3 text-blue-500 md:h-3.5 md:w-3.5"></i-lucide>
    Доставка
  </div>
  <div class="max-w-[150px] truncate text-[10px] text-slate-500 md:max-w-[200px] md:text-xs dark:text-slate-400">
    {{ order().address }}
  </div>
</td>
<td class="px-4 py-3 text-xs font-bold whitespace-nowrap text-slate-900 md:px-6 md:py-4 md:text-sm dark:text-white">
  {{ order().totalPrice | currency: 'RUB' : 'symbol' : '1.2-2' }}
</td>
<td class="px-4 py-3 text-center md:px-6 md:py-4">
  <span
    class="rounded-md border border-blue-200 bg-blue-100 px-2 py-1 text-[10px] font-semibold text-blue-700 md:px-2.5 md:py-1.5 md:text-xs dark:border-blue-800 dark:bg-blue-900/30 dark:text-blue-400"
  >
    {{ order().status }}
  </span>
</td>
<td class="px-4 py-3 text-right md:px-6 md:py-4">
  <div class="flex items-center justify-end gap-1 md:gap-2">
    <button
      class="rounded-md bg-gray-100 p-1.5 text-slate-400 transition-colors hover:bg-orange-50 hover:text-orange-500 dark:bg-slate-800 dark:hover:bg-orange-900/20"
      title="Позвонить"
    >
      <i-lucide [name]="Phone" class="h-3.5 w-3.5 md:h-4 md:w-4"></i-lucide>
    </button>
    <button
      class="rounded-md bg-gray-100 p-1.5 text-slate-400 transition-colors hover:bg-blue-50 hover:text-blue-500 dark:bg-slate-800 dark:hover:bg-blue-900/20"
      title="Детали"
    >
      <i-lucide [name]="Eye" class="h-3.5 w-3.5 md:h-4 md:w-4"></i-lucide>
    </button>
    <button
      class="rounded-md bg-gray-100 p-1.5 text-slate-400 transition-colors hover:bg-gray-200 hover:text-slate-900 dark:bg-slate-800 dark:hover:bg-slate-700 dark:hover:text-white"
      title="Перевести статус"
    >
      <i-lucide [name]="ArrowRight" class="h-3.5 w-3.5 md:h-4 md:w-4"></i-lucide>
    </button>
  </div>
</td>
