<div class="bg-white dark:bg-slate-950 min-h-full rounded-2xl border border-gray-100 dark:border-slate-800 shadow-sm p-4 md:p-6">
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4 md:mb-6">
    <h1 class="text-xl md:text-2xl font-bold text-slate-900 dark:text-white">ЖУРНАЛ ЗАКАЗОВ</h1>
    
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 w-full md:w-auto">
      <ui-input
        class="relative w-full sm:w-64"
      >
      <i-lucide suffix [name]="Search" class="w-4 h-4 text-slate-400"></i-lucide>
    </ui-input>
      <button ui-button variant="outline" size="sm">
        <i-lucide [name]="Funnel" class="w-4 h-4"></i-lucide>
        Фильтры
      </button>
      <button ui-button  size="sm" (click)="addOrder()">
        <i-lucide [name]="Plus" class="w-4 h-4"></i-lucide>
        Новый заказ
      </button>
    </div>
  </div>

  <div class="flex overflow-x-auto border-b border-gray-200 dark:border-slate-800 mb-4 md:mb-6 no-scrollbar">
    <button class="px-4 md:px-6 py-2.5 md:py-3 text-xs md:text-sm font-medium border-b-2 transition-colors whitespace-nowrap border-orange-500 text-orange-600 dark:text-orange-500">
      Активные
    </button>
    <button class="px-4 md:px-6 py-2.5 md:py-3 text-xs md:text-sm font-medium border-b-2 transition-colors whitespace-nowrap border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-300 hover:border-gray-300 dark:hover:border-slate-600">
      Завершенные
    </button>
    <button class="px-4 md:px-6 py-2.5 md:py-3 text-xs md:text-sm font-medium border-b-2 transition-colors whitespace-nowrap border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-300 hover:border-gray-300 dark:hover:border-slate-600">
      Отмененные
    </button>
  </div>

  <div class="overflow-x-auto -mx-4 md:mx-0 px-4 md:px-0">
    <div class="rounded-xl border border-gray-200 dark:border-slate-800 min-w-[700px]">
      <table class="w-full text-sm text-left">
        <thead class="text-xs text-slate-500 bg-gray-50 dark:bg-slate-900 uppercase font-medium">
          <tr>
            <th class="px-4 md:px-6 py-4">Заказ</th>
            <th class="px-4 md:px-6 py-4">Время</th>
            <th class="px-4 md:px-6 py-4">Клиент</th>
            <th class="px-4 md:px-6 py-4">Тип / Адрес</th>
            <th class="px-4 md:px-6 py-4">Сумма</th>
            <th class="px-4 md:px-6 py-4 text-center">Статус</th>
            <th class="px-4 md:px-6 py-4 text-right">Действия</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-200 dark:divide-slate-800">
          
          @for (order of orders(); track order.id) {
            <tr [app-order-item]="order" class="hover:bg-gray-50/50 dark:hover:bg-slate-900/50 transition-colors"></tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
