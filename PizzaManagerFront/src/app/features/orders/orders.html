<div class="min-h-full rounded-2xl border border-gray-100 bg-white p-4 shadow-sm md:p-6 dark:border-slate-800 dark:bg-slate-950">
  <div class="mb-4 flex flex-col items-start justify-between gap-4 md:mb-6 md:flex-row md:items-center">
    <h1 class="text-xl font-bold text-slate-900 md:text-2xl dark:text-white">ЖУРНАЛ ЗАКАЗОВ</h1>

    <div class="flex w-full flex-col items-stretch gap-3 sm:flex-row sm:items-center md:w-auto">
      <ui-input class="relative w-full sm:w-64">
        <i-lucide suffix [name]="Search" class="h-4 w-4 text-slate-400"></i-lucide>
      </ui-input>
      <button ui-button variant="outline" size="sm">
        <i-lucide [name]="Funnel" class="h-4 w-4"></i-lucide>
        Фильтры
      </button>
      <button ui-button size="sm" (click)="addOrder()">
        <i-lucide [name]="Plus" class="h-4 w-4"></i-lucide>
        Новый заказ
      </button>
    </div>
  </div>

  <div class="no-scrollbar mb-4 flex overflow-x-auto border-b border-gray-200 md:mb-6 dark:border-slate-800">
    <button
      class="border-b-2 border-orange-500 px-4 py-2.5 text-xs font-medium whitespace-nowrap text-orange-600 transition-colors md:px-6 md:py-3 md:text-sm dark:text-orange-500"
    >
      Активные
    </button>
    <button
      class="border-b-2 border-transparent px-4 py-2.5 text-xs font-medium whitespace-nowrap text-slate-500 transition-colors hover:border-gray-300 hover:text-slate-700 md:px-6 md:py-3 md:text-sm dark:text-slate-400 dark:hover:border-slate-600 dark:hover:text-slate-300"
    >
      Завершенные
    </button>
    <button
      class="border-b-2 border-transparent px-4 py-2.5 text-xs font-medium whitespace-nowrap text-slate-500 transition-colors hover:border-gray-300 hover:text-slate-700 md:px-6 md:py-3 md:text-sm dark:text-slate-400 dark:hover:border-slate-600 dark:hover:text-slate-300"
    >
      Отмененные
    </button>
  </div>

  <div class="-mx-4 overflow-x-auto px-4 md:mx-0 md:px-0">
    <div class="min-w-[700px] rounded-xl border border-gray-200 dark:border-slate-800">
      <table class="w-full text-left text-sm">
        <thead class="bg-gray-50 text-xs font-medium text-slate-500 uppercase dark:bg-slate-900">
          <tr>
            <th class="px-4 py-4 md:px-6">Заказ</th>
            <th class="px-4 py-4 md:px-6">Время</th>
            <th class="px-4 py-4 md:px-6">Клиент</th>
            <th class="px-4 py-4 md:px-6">Тип / Адрес</th>
            <th class="px-4 py-4 md:px-6">Сумма</th>
            <th class="px-4 py-4 text-center md:px-6">Статус</th>
            <th class="px-4 py-4 text-right md:px-6">Действия</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-200 dark:divide-slate-800">
          @for (order of orders(); track order.id) {
            <tr [app-order-item]="order" class="transition-colors hover:bg-gray-50/50 dark:hover:bg-slate-900/50"></tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
