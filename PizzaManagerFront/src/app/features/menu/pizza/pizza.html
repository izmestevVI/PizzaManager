<div class="space-y-6">
  <header
    class="flex flex-col items-start justify-between gap-4 rounded-2xl border border-gray-100 bg-white p-4 shadow-sm transition-colors duration-200 sm:flex-row sm:items-center md:p-6 dark:border-slate-800 dark:bg-slate-950"
  >
    <div class="flex items-center gap-3">
      <button
        routerLink=".."
        type="button"
        class="rounded-full p-2 text-slate-500 transition-colors hover:bg-gray-100 dark:hover:bg-slate-800"
      >
        <i-lucide [name]="ArrowLeft" class="h-5 w-5"></i-lucide>
      </button>
      <h1 class="text-xl font-bold tracking-tight text-slate-950 uppercase md:text-2xl dark:text-white">
        {{ header() }}
      </h1>
    </div>

    <div class="flex w-full items-center gap-3 sm:w-auto">
      <button ui-button variant="outline" size="sm" routerLink="..">Отмена</button>
      <button ui-button size="sm" [disabled]="isFormInvalid()" (click)="addOrUpdatePizza()">
        <i-lucide [name]="Save" class="h-4 w-4"></i-lucide>
        {{ nameSaveButton() }}
      </button>
    </div>
  </header>

  <form [formGroup]="pizzaForm" class="space-y-6">
    <section
      class="space-y-6 rounded-2xl border border-gray-100 bg-white p-4 shadow-sm transition-colors duration-200 md:p-6 dark:border-slate-800 dark:bg-slate-950"
    >
      <h2 class="text-lg font-semibold text-slate-950 dark:text-white">ОСНОВНАЯ ИНФОРМАЦИЯ</h2>

      <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
        <div class="space-y-3">
          <span class="block text-sm font-medium text-slate-700 dark:text-slate-300">Фото пиццы</span>
          <div
            class="flex aspect-[4/3] w-full max-w-[280px] cursor-pointer flex-col items-center justify-center rounded-xl border-2 border-dashed border-gray-200 bg-gray-50 p-4 text-center transition-colors hover:border-orange-300 dark:border-slate-700 dark:bg-slate-900 dark:hover:border-orange-600"
          >
            <div class="mb-3 flex h-16 w-16 items-center justify-center rounded-full bg-orange-100 text-orange-500 dark:bg-orange-500/20">
              <i-lucide [name]="Image" class="h-8 w-8"></i-lucide>
            </div>
          </div>
        </div>

        <div class="space-y-5">
          <div>
            <ui-input label="Название пиццы" placeholder="Пепперони (акц.)" [formControl]="pizzaForm.controls.name"></ui-input>
          </div>

          <div>
            <ui-textarea
              label="Описание"
              placeholder="Классическая пицца с острой колбаской..."
              [formControl]="pizzaForm.controls.description"
            ></ui-textarea>
          </div>
          <div>
            <ui-multi-select
              label="Категории"
              placeholder="Выберите категории"
              [options]="categorys() ?? []"
              [formControl]="pizzaForm.controls.categorys"
            ></ui-multi-select>
          </div>
        </div>
      </div>
    </section>

    <section
      class="space-y-6 rounded-2xl border border-gray-100 bg-white p-4 shadow-sm transition-colors duration-200 md:p-6 dark:border-slate-800 dark:bg-slate-950"
    >
      <h2 class="text-lg font-semibold text-slate-950 dark:text-white">ЦЕНЫ И ВАРИАЦИИ</h2>

      <div class="-mx-6 overflow-x-auto px-6">
        <table class="w-full min-w-[600px] text-left text-sm">
          <thead class="bg-gray-50/50 text-xs text-slate-500 uppercase dark:bg-slate-900/50 dark:text-slate-400">
            <tr>
              <th class="px-3 py-2 font-medium">Разм.</th>
              <th class="px-3 py-2 font-medium">Вес (г)</th>
              <th class="px-3 py-2 font-medium">Цена ₽</th>
              <th class="px-3 py-2 text-center font-medium">Статус</th>
            </tr>
          </thead>
          <tbody formArrayName="variants" class="divide-y divide-gray-100 dark:divide-slate-800">
            <tr class="transition-colors hover:bg-gray-50/50 dark:hover:bg-slate-900/50">
              <td class="px-3 py-3 font-bold text-slate-900 dark:text-white">[S]</td>
              <td class="px-3 py-3">
                <ui-input
                  placeholder="280"
                  [formControl]="pizzaForm.controls.variants.controls[0].controls.weight"
                  inputClass="w-24 px-3 py-1.5 bg-transparent border border-gray-200 dark:border-slate-700 rounded-md text-sm dark:text-white focus:border-orange-400"
                ></ui-input>
              </td>
              <td class="px-3 py-3">
                <ui-input
                  [formControl]="pizzaForm.controls.variants.controls[0].controls.price"
                  inputClass="w-24 px-3 py-1.5 bg-transparent border border-gray-200 dark:border-slate-700 rounded-md text-sm dark:text-white focus:border-orange-400"
                ></ui-input>
              </td>
              <td class="px-3 py-3 text-center">
                <ui-toggle [formControl]="pizzaForm.controls.variants.controls[0].controls.inStock"></ui-toggle>
              </td>
            </tr>
            <tr class="transition-colors hover:bg-gray-50/50 dark:hover:bg-slate-900/50">
              <td class="px-3 py-3 font-bold text-slate-900 dark:text-white">[M]</td>
              <td class="px-3 py-3">
                <ui-input
                  placeholder="350"
                  [formControl]="pizzaForm.controls.variants.controls[1].controls.weight"
                  inputClass="w-24 px-3 py-1.5 bg-transparent border border-gray-200 dark:border-slate-700 rounded-md text-sm dark:text-white focus:border-orange-400"
                ></ui-input>
              </td>
              <td class="px-3 py-3">
                <ui-input
                  [formControl]="pizzaForm.controls.variants.controls[1].controls.price"
                  inputClass="w-24 px-3 py-1.5 bg-transparent border border-gray-200 dark:border-slate-700 rounded-md text-sm dark:text-white focus:border-orange-400"
                ></ui-input>
              </td>
              <td class="px-3 py-3 text-center">
                <ui-toggle [formControl]="pizzaForm.controls.variants.controls[1].controls.inStock"></ui-toggle>
              </td>
            </tr>
            <tr class="transition-colors hover:bg-gray-50/50 dark:hover:bg-slate-900/50">
              <td class="px-3 py-3 font-bold text-slate-900 dark:text-white">[L]</td>
              <td class="px-3 py-3">
                <ui-input
                  placeholder="420"
                  [formControl]="pizzaForm.controls.variants.controls[2].controls.weight"
                  inputClass="w-24 px-3 py-1.5 bg-transparent border border-gray-200 dark:border-slate-700 rounded-md text-sm dark:text-white focus:border-orange-400"
                ></ui-input>
              </td>
              <td class="px-3 py-3">
                <ui-input
                  [formControl]="pizzaForm.controls.variants.controls[2].controls.price"
                  inputClass="w-24 px-3 py-1.5 bg-transparent border border-gray-200 dark:border-slate-700 rounded-md text-sm dark:text-white focus:border-orange-400"
                ></ui-input>
              </td>
              <td class="px-3 py-3 text-center">
                <ui-toggle [formControl]="pizzaForm.controls.variants.controls[2].controls.inStock"></ui-toggle>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section
      class="space-y-6 rounded-2xl border border-gray-100 bg-white p-4 shadow-sm transition-colors duration-200 md:p-6 dark:border-slate-800 dark:bg-slate-950"
    >
      <h2 class="text-lg font-semibold text-slate-950 dark:text-white">КОНСТРУКТОР СОСТАВА</h2>

      <div class="grid grid-cols-1 items-start gap-6 md:grid-cols-2">
        <div class="space-y-4">
          <h3 class="text-sm font-medium text-slate-600 dark:text-slate-400">Ингредиенты</h3>

          <div class="space-y-2" formArrayName="ingredients">
            @if (this.ingredients(); as ingredients) {
              @for (control of pizzaForm.controls.ingredients.controls; track control) {
                <div>
                  <ui-checkbox [label]="[...ingredients][$index]?.name ?? ''" [formControl]="control"></ui-checkbox>
                </div>
              }
            }
          </div>
        </div>
        <div class="space-y-4"></div>
      </div>
    </section>
  </form>
</div>
