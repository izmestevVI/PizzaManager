<div class="min-h-full rounded-2xl border border-gray-100 bg-white p-4 shadow-sm md:p-6 dark:border-slate-800 dark:bg-slate-950">
  <div class="mb-4 flex flex-col items-start justify-between gap-4 md:mb-6 md:flex-row md:items-center">
    <h1 class="text-xl font-bold text-slate-900 md:text-2xl dark:text-white">МЕНЮ ПИЦЦ</h1>

    <div class="flex w-full flex-col items-stretch gap-3 sm:flex-row sm:items-center md:w-auto">
      <ui-input placeholder="Поиск пиццы..." class="relative w-full sm:w-64">
        <i-lucide suffix [name]="Search" class="h-4 w-4 text-slate-400"></i-lucide>
      </ui-input>

      <button ui-button routerLink="new" size="sm">
        <i-lucide [name]="Plus" class="h-4 w-4"></i-lucide>
        ДОБАВИТЬ ПИЦЦУ
      </button>
    </div>
  </div>

  <div class="mb-4 flex flex-col items-stretch gap-3 sm:flex-row sm:items-center md:mb-6">
    <ui-select label="Категории:" [options]="categoryOptions" placeholder="Категории" width="240px" variant="inline"></ui-select>
    <ui-select-button [options]="filterOptoins" variant="inline"></ui-select-button>
  </div>

  <div class="-mx-4 overflow-x-auto px-4 md:mx-0 md:px-0">
    <div class="min-w-[700px] rounded-xl border border-gray-200 dark:border-slate-800">
      <table class="w-full text-left text-sm">
        <thead class="bg-gray-50 text-xs font-medium text-slate-500 uppercase dark:bg-slate-900">
          <tr>
            <th class="px-4 py-4 md:px-6"></th>
            <th class="px-4 py-4 md:px-6">Название</th>
            <th class="px-4 py-4 md:px-6">Категория</th>
            <th class="px-4 py-4 text-center md:px-6">S / M / L</th>
            <th class="px-4 py-4 text-right md:px-6">Действия</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-200 dark:divide-slate-800">
          @for (pizza of pizzas(); track pizza.id) {
            <tr
              [app-menu-item]="pizza"
              (deletePizza)="deletePizza(pizza.id)"
              class="transition-colors hover:bg-gray-50/50 dark:hover:bg-slate-900/50"
            ></tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
