<div class="bg-white dark:bg-slate-950 min-h-full rounded-2xl border border-gray-100 dark:border-slate-800 shadow-sm p-4 md:p-6">
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4 md:mb-6">
    <h1 class="text-xl md:text-2xl font-bold text-slate-900 dark:text-white">МЕНЮ ПИЦЦ</h1>
    
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 w-full md:w-auto">
      <ui-input
        placeholder="Поиск пиццы..."
        class="relative w-full sm:w-64"
      >
        <i-lucide suffix [name]="Search" class="w-4 h-4 text-slate-400"></i-lucide>
      </ui-input>

      <button ui-button routerLink="new" size="sm">
        <i-lucide [name]="Plus" class="w-4 h-4"></i-lucide>
        ДОБАВИТЬ ПИЦЦУ
      </button>
    </div>
  </div>

  <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 mb-4 md:mb-6">
    <ui-select
        label="Категории:"
        [options]="categoryOptions"
        placeholder="Категории"
        width="240px"
        variant="inline"
      ></ui-select>
    <ui-select-button
        [options]="filterOptoins"
        variant="inline"
      ></ui-select-button>
  </div>

  <div class="overflow-x-auto -mx-4 md:mx-0 px-4 md:px-0">
    <div class="rounded-xl border border-gray-200 dark:border-slate-800 min-w-[700px]">
      <table class="w-full text-sm text-left">
        <thead class="text-xs text-slate-500 bg-gray-50 dark:bg-slate-900 uppercase font-medium">
          <tr>
            <th class="px-4 md:px-6 py-4"></th>
            <th class="px-4 md:px-6 py-4">Название</th>
            <th class="px-4 md:px-6 py-4">Категория</th>
            <th class="px-4 md:px-6 py-4 text-center">S / M / L</th>
            <th class="px-4 md:px-6 py-4 text-right">Действия</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-200 dark:divide-slate-800">
          @for (pizza of pizzas(); track pizza.id) {
            <tr 
              [app-menu-item]="pizza"
              (deletePizza)="deletePizza(pizza.id)"
              class="hover:bg-gray-50/50 dark:hover:bg-slate-900/50 transition-colors">
          </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
