<td class="px-4 md:px-6 py-3 md:py-4">
    <div
        class="w-8 h-8 md:w-10 md:h-10 rounded-lg bg-orange-100 dark:bg-orange-900/30 flex items-center justify-center text-lg md:text-xl shadow-inner">
        🍕
    </div>
</td>
<td class="px-4 md:px-6 py-3 md:py-4 font-medium text-slate-900 dark:text-white">
    {{ pizza().name }}
</td>
<td class="px-4 md:px-6 py-3 md:py-4">
    <div class="flex gap-1.5 flex-wrap">
        @for (category of pizza().categories; track category) {
        <span
            class="px-2 py-0.5 md:py-1 rounded-md text-[10px] md:text-xs font-medium bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400">
            {{ category }}
        </span>
        }
    </div>
</td>
<td class="px-4 md:px-6 py-3 md:py-4 text-center text-slate-600 dark:text-slate-400 font-mono text-xs md:text-sm">
    {{ variantPrice() }}
</td>
<td class="px-4 md:px-6 py-3 md:py-4 text-right">
    <div class="flex items-center justify-end gap-1 md:gap-2">
        <button routerLink="{{pizza().id}}"
            class="p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 bg-gray-100 hover:bg-gray-200 dark:bg-slate-800 dark:hover:bg-slate-700 rounded-md transition-colors">
            <i-lucide [name]="Pen" class="w-3.5 h-3.5 md:w-4 md:h-4"></i-lucide>
        </button>
        <button (click)="deletePizza.emit()"
            class="p-1.5 text-red-400 hover:text-red-600 dark:hover:text-red-300 bg-red-50 hover:bg-red-100 dark:bg-red-900/20 dark:hover:bg-red-900/40 rounded-md transition-colors">
            <i-lucide [name]="Trash2" class="w-3.5 h-3.5 md:w-4 md:h-4"></i-lucide>
        </button>
    </div>
</td>
