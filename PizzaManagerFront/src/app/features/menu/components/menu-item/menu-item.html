<td class="px-4 py-3 md:px-6 md:py-4">
  <div
    class="flex h-8 w-8 items-center justify-center rounded-lg bg-orange-100 text-lg shadow-inner md:h-10 md:w-10 md:text-xl dark:bg-orange-900/30"
  >
    🍕
  </div>
</td>
<td class="px-4 py-3 font-medium text-slate-900 md:px-6 md:py-4 dark:text-white">
  {{ pizza().name }}
</td>
<td class="px-4 py-3 md:px-6 md:py-4">
  <div class="flex flex-wrap gap-1.5">
    @for (category of pizza().categories; track category) {
      <span
        class="rounded-md bg-red-100 px-2 py-0.5 text-[10px] font-medium text-red-700 md:py-1 md:text-xs dark:bg-red-900/30 dark:text-red-400"
      >
        {{ category }}
      </span>
    }
  </div>
</td>
<td class="px-4 py-3 text-center font-mono text-xs text-slate-600 md:px-6 md:py-4 md:text-sm dark:text-slate-400">
  {{ variantPrice() }}
</td>
<td class="px-4 py-3 text-right md:px-6 md:py-4">
  <div class="flex items-center justify-end gap-1 md:gap-2">
    <button
      routerLink="{{ pizza().id }}"
      class="rounded-md bg-gray-100 p-1.5 text-slate-400 transition-colors hover:bg-gray-200 hover:text-slate-600 dark:bg-slate-800 dark:hover:bg-slate-700 dark:hover:text-slate-200"
    >
      <i-lucide [name]="Pen" class="h-3.5 w-3.5 md:h-4 md:w-4"></i-lucide>
    </button>
    <button
      (click)="deletePizza.emit()"
      class="rounded-md bg-red-50 p-1.5 text-red-400 transition-colors hover:bg-red-100 hover:text-red-600 dark:bg-red-900/20 dark:hover:bg-red-900/40 dark:hover:text-red-300"
    >
      <i-lucide [name]="Trash2" class="h-3.5 w-3.5 md:h-4 md:w-4"></i-lucide>
    </button>
  </div>
</td>
