<div class="-mx-4 overflow-x-auto px-4 md:mx-0 md:px-0">
  <div class="min-w-[500px]">
    <table class="w-full text-left text-sm">
      <thead class="bg-gray-50/50 text-xs text-slate-500 uppercase dark:bg-slate-900/50 dark:text-slate-400">
        <tr>
          <th class="rounded-tl-lg px-4 py-3 font-medium">No</th>
          <th class="px-4 py-3 font-medium">Time</th>
          <th class="px-4 py-3 font-medium">Client</th>
          <th class="px-4 py-3 font-medium">Sum</th>
          <th class="rounded-tr-lg px-4 py-3 font-medium">Status</th>
        </tr>
      </thead>
      <tbody>
        @for (order of orders(); track order.id) {
          <tr
            [app-widget-latest-orders-item]="order"
            class="border-b border-gray-50 transition-colors last:border-0 hover:bg-gray-50/50 dark:border-slate-800/50 dark:hover:bg-slate-900/50"
          ></tr>
        }
      </tbody>
    </table>
  </div>
</div>
