<td class="px-4 py-3 font-medium text-slate-900 md:py-4 dark:text-white">№{{ order().id }}</td>
<td class="px-4 py-3 text-slate-600 md:py-4 dark:text-slate-400">{{ order().createdAt | date: 'HH:mm' }}</td>
<td class="px-4 py-3 text-slate-600 md:py-4 dark:text-slate-400">{{ order().customerName }}</td>
<td class="px-4 py-3 font-medium text-slate-900 md:py-4 dark:text-white">
  {{ order().totalPrice | currency: 'RUB' : 'symbol' : '1.2-2' }}
</td>
<td class="px-4 py-3 md:py-4">
  <span class="rounded-md bg-green-100 px-2.5 py-1 text-xs font-medium text-green-700 dark:bg-green-900/30 dark:text-green-400">
    {{ order().status }}
  </span>
</td>
