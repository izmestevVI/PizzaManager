<div class="space-y-4 md:space-y-6">
  <!-- Top Stats -->
  <div class="grid grid-cols-2 gap-3 md:gap-6 lg:grid-cols-4">
    <!-- Stat Card 1 -->
    <app-card-layout
      title="Выручка"
      class="flex flex-col justify-between overflow-hidden rounded-2xl border border-gray-100 bg-white p-3 shadow-sm md:p-5 dark:border-slate-800 dark:bg-slate-950"
    >
      <app-card-revenue></app-card-revenue>
    </app-card-layout>

    <!-- Stat Card 2 -->
    <app-card-layout
      title="Заказы"
      class="flex flex-col justify-between overflow-hidden rounded-2xl border border-gray-100 bg-white p-3 shadow-sm md:p-5 dark:border-slate-800 dark:bg-slate-950"
    >
      <i-lucide icon [name]="ShoppingCart" class="h-4 w-4 shrink-0 text-slate-400 md:h-5 md:w-5 dark:text-slate-500"></i-lucide>
      <app-card-orders></app-card-orders>
    </app-card-layout>

    <!-- Stat Card 3 -->
    <app-card-layout
      title="Ср. Чек"
      class="flex flex-col justify-between overflow-hidden rounded-2xl border border-gray-100 bg-white p-3 shadow-sm md:p-5 dark:border-slate-800 dark:bg-slate-950"
    >
      <app-card-average-bill></app-card-average-bill>
    </app-card-layout>

    <!-- Stat Card 4 -->
    <app-card-layout
      title="Ожидание"
      class="flex flex-col justify-between overflow-hidden rounded-2xl border border-gray-100 bg-white p-3 shadow-sm md:p-5 dark:border-slate-800 dark:bg-slate-950"
    >
      <i-lucide icon [name]="Clock" class="h-4 w-4 shrink-0 text-slate-400 md:h-5 md:w-5 dark:text-slate-500"></i-lucide>
      <app-card-waiting></app-card-waiting>
    </app-card-layout>
  </div>

  <!-- Middle Charts -->
  <div class="grid grid-cols-1 gap-4 md:gap-6 lg:grid-cols-3">
    <app-widget-layout
      title="Динамика продаж"
      class="rounded-2xl border border-gray-100 bg-white p-4 shadow-sm md:p-6 lg:col-span-2 dark:border-slate-800 dark:bg-slate-950"
    >
      <app-widget-sales-chart></app-widget-sales-chart>
    </app-widget-layout>

    <app-widget-layout
      title="Топ-5 пицц"
      class="rounded-2xl border border-gray-100 bg-white p-4 shadow-sm md:p-6 dark:border-slate-800 dark:bg-slate-950"
    >
      <app-widget-top-pizzas></app-widget-top-pizzas>
    </app-widget-layout>
  </div>

  <!-- Bottom Section -->
  <div class="grid grid-cols-1 gap-4 md:gap-6 lg:grid-cols-3">
    <app-widget-layout
      title="Последние заказы"
      class="rounded-2xl border border-gray-100 bg-white p-4 shadow-sm md:p-6 lg:col-span-2 dark:border-slate-800 dark:bg-slate-950"
    >
      <app-widget-latest-orders></app-widget-latest-orders>
    </app-widget-layout>

    <app-widget-layout
      title="Прогноз нагрузки"
      class="flex flex-col justify-between rounded-2xl border border-gray-100 bg-white p-4 shadow-sm md:p-6 dark:border-slate-800 dark:bg-slate-950"
    >
      <app-widget-load-forecast></app-widget-load-forecast>
    </app-widget-layout>
  </div>
</div>
