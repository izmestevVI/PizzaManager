<div #container #trigger="cdkOverlayOrigin" cdkOverlayOrigin [style.width]="width()" [class]="containerClass()">
  @if (label()) {
    <label [for]="id()" [class]="labelClass()">
      {{ label() }}
    </label>
  }

  <button type="button" [id]="id()" (click)="toggle()" [disabled]="isDisabled()" [class]="triggerClass()">
    <span class="truncate" [class.text-slate-400]="!selectedLabel()">
      {{ selectedLabel() || placeholder() || 'Выберите...' }}
    </span>

    <i-lucide
      [name]="ChevronDown"
      class="h-4 w-4 text-slate-400 transition-transform duration-200"
      [class.rotate-180]="isOpen()"
    ></i-lucide>
  </button>

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="trigger"
    [cdkConnectedOverlayOpen]="isOpen()"
    [cdkConnectedOverlayPositions]="overlayPositions"
    [cdkConnectedOverlayWidth]="container.offsetWidth"
    [cdkConnectedOverlayScrollStrategy]="scrollStrategy"
    [cdkConnectedOverlayPush]="false"
    (overlayOutsideClick)="close()"
    (detach)="close()"
  >
    <div
      class="animate-in fade-in zoom-in-95 z-50 w-full overflow-hidden rounded-xl border border-gray-200 bg-white shadow-2xl duration-100 dark:border-slate-800 dark:bg-slate-900"
    >
      <ul class="custom-scrollbar max-h-[240px] overflow-y-auto p-1.5">
        @for (opt of options(); track opt.value) {
          <li>
            <button
              type="button"
              (click)="selectOption(opt)"
              class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left text-sm transition-colors"
              [class]="
                value() === opt.value
                  ? 'bg-orange-50 font-semibold text-orange-600 dark:bg-orange-500/10 dark:text-orange-400'
                  : 'text-slate-700 hover:bg-gray-100 dark:text-slate-300 dark:hover:bg-slate-800'
              "
            >
              @if (opt.icon) {
                <i-lucide [name]="opt.icon" class="h-4 w-4"></i-lucide>
              }
              <div class="flex flex-col">
                <span>{{ opt.label }}</span>
                @if (opt.description) {
                  <span class="text-[10px] leading-tight font-normal opacity-60">{{ opt.description }}</span>
                }
              </div>

              @if (value() === opt.value) {
                <i-lucide [name]="Check" class="ml-auto h-4 w-4"></i-lucide>
              }
            </button>
          </li>
        } @empty {
          <li class="px-4 py-3 text-center text-sm text-slate-500">Нет доступных вариантов</li>
        }
      </ul>
    </div>
  </ng-template>

  <ui-form-error [message]="errorMessage()"></ui-form-error>
</div>
