<div #container #trigger="cdkOverlayOrigin" cdkOverlayOrigin [style.width]="width()" [class]="containerClass()">
  @if (label()) {
    <label [class]="labelClass()">{{ label() }}{{ variant() === 'inline' ? ':' : '' }}</label>
  }

  <button type="button" (click)="toggle()" [disabled]="isDisabled()" [class]="triggerClass()">
    <span class="truncate" [class.text-slate-400]="!selectedLabels()">
      {{ selectedLabels() || placeholder() }}
    </span>
    <i-lucide [name]="ChevronDown" class="w-4 h-4 text-slate-400 transition-transform duration-200"
              [class.rotate-180]="isOpen()"></i-lucide>
  </button>

  <ng-template cdkConnectedOverlay [cdkConnectedOverlayOrigin]="trigger" [cdkConnectedOverlayOpen]="isOpen()"
               [cdkConnectedOverlayPositions]="overlayPositions" [cdkConnectedOverlayWidth]="container.offsetWidth"
               [cdkConnectedOverlayScrollStrategy]="scrollStrategy" (overlayOutsideClick)="close()">
    
    <div class="w-full bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-800 rounded-xl shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-100 z-50">
      <ul class="max-h-[240px] overflow-y-auto p-1.5 custom-scrollbar">
        @for (opt of options(); track opt.value) {
          @let isSelected = (value() || []).includes(opt.value);
          <li>
            <button type="button" (click)="selectOption(opt)"
                    class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors text-left"
                    [class]="isSelected 
                             ? 'bg-orange-50 dark:bg-orange-500/10 text-orange-600 dark:text-orange-400 font-semibold' 
                             : 'text-slate-700 dark:text-slate-300 hover:bg-gray-100 dark:hover:bg-slate-800'">
              
              <div class="w-4 h-4 border rounded flex items-center justify-center transition-colors"
                   [class]="isSelected ? 'bg-orange-500 border-orange-500' : 'border-gray-300 dark:border-slate-600'">
                @if (isSelected) {
                  <i-lucide [name]="Check" class="w-3 h-3 text-white"></i-lucide>
                }
              </div>

              <div class="flex flex-col">
                <span>{{ opt.label }}</span>
              </div>
            </button>
          </li>
        }
      </ul>
    </div>
  </ng-template>
  <ui-form-error [message]="errorMessage()"></ui-form-error>
</div>
