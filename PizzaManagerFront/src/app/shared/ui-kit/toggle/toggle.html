<label [for]="id()" class="inline-flex items-center gap-3 cursor-pointer group select-none">
    <div class="relative flex items-center">
        <input type="checkbox" [id]="id()" [checked]="value()" [disabled]="isDisabled()"
            (change)="onInputChange($event)" (blur)="handleBlur()" class="sr-only" />

        <div class="w-11 h-6 rounded-full transition-colors duration-200 ease-in-out border border-transparent" [class]="value() 
            ? 'bg-orange-500' 
            : 'bg-gray-200 dark:bg-slate-800'"></div>

        <div class="absolute left-1 w-4 h-4 bg-white rounded-full shadow-md transition-transform duration-200 ease-in-out"
            [class.translate-x-5]="value()"></div>

        <span class="absolute left-1.5 text-[8px] font-bold text-white transition-opacity duration-200"
            [class.opacity-100]="value()" [class.opacity-0]="!value()">ON</span>
        <span class="absolute right-1.5 text-[8px] font-bold text-slate-400 transition-opacity duration-200"
            [class.opacity-100]="!value()" [class.opacity-0]="value()">OFF</span>
    </div>

    @if (label()) {
    <span class="text-sm font-medium text-slate-700 dark:text-slate-300" [class.opacity-50]="isDisabled()">
        {{ label() }}
    </span>
    }
</label>
