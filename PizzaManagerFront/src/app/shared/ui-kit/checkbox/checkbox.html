<label [for]="id()" class="group inline-flex cursor-pointer items-center gap-3 select-none">
  <div class="relative flex items-center">
    <input
      type="checkbox"
      [id]="id()"
      [checked]="value()"
      [disabled]="isDisabled()"
      (change)="onInputChange($event)"
      (blur)="handleBlur()"
      class="sr-only"
    />

    <div
      class="flex h-5 w-5 items-center justify-center rounded border-2 transition-all duration-200"
      [class]="
        value()
          ? 'border-orange-500 bg-orange-500 shadow-sm'
          : 'border-gray-300 bg-white group-hover:border-orange-400 dark:border-slate-700 dark:bg-slate-900'
      "
    >
      @if (value()) {
        <i-lucide [name]="Check" class="animate-in zoom-in-50 h-3.5 w-3.5 text-white duration-200"></i-lucide>
      }
    </div>
  </div>

  @if (label()) {
    <span class="text-sm font-medium text-slate-700 transition-colors dark:text-slate-300" [class.opacity-50]="isDisabled()">
      {{ label() }}
    </span>
  }
</label>
