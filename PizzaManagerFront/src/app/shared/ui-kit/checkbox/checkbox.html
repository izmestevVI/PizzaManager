<label [for]="id()" class="inline-flex items-center gap-3 cursor-pointer group select-none">
    <div class="relative flex items-center">
        <input type="checkbox" [id]="id()" [checked]="value()" [disabled]="isDisabled()"
            (change)="onInputChange($event)" (blur)="handleBlur()" class="sr-only" />

        <div class="w-5 h-5 rounded border-2 transition-all duration-200 flex items-center justify-center" [class]="value() 
            ? 'bg-orange-500 border-orange-500 shadow-sm' 
            : 'bg-white dark:bg-slate-900 border-gray-300 dark:border-slate-700 group-hover:border-orange-400'">
            @if (value()) {
            <i-lucide [name]="Check" class="w-3.5 h-3.5 text-white animate-in zoom-in-50 duration-200"></i-lucide>
            }
        </div>
    </div>

    @if (label()) {
    <span class="text-sm font-medium text-slate-700 dark:text-slate-300 transition-colors"
        [class.opacity-50]="isDisabled()">
        {{ label() }}
    </span>
    }
</label>
