<div [class]="containerClass()">
  @if (label()) {
    <span [class]="labelClass()" class="pl-3">
      {{ label() }}
    </span>
  }

  <div [class]="groupClass()" role="group">
    @for (option of options(); track option.value) {
      <button type="button" [disabled]="isDisabled() || option.disabled" (click)="select(option.value)" [class]="buttonClass(option.value)">
        {{ option.label }}
      </button>
    }
  </div>
</div>
